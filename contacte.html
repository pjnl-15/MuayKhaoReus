<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muay Khao Reus · Contacte</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body id="top">
  <!-- HEADER -->
  <header class="header">
    <nav class="navbar">
      <a href="index.html" class="logo">MUAY KHAO REUS</a>
      <div style="display:flex; align-items:center; gap:16px; position:relative;">
        <button class="hamburger" aria-label="Obrir menú">☰</button>
        <div class="nav nav-links">
          <a href="index.html" class="nav-link">Inici</a>
          <a href="info.html" class="nav-link">Informació</a>
          <a href="multimedia.html" class="nav-link">Multimèdia</a>
          <a href="mapa.html" class="nav-link">Mapa</a>
          <a href="contacte.html" class="nav-link active">Contacte</a>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="section">
      <div class="container contact-grid">
        <div class="panel contact-text">
          <h2>Contacte</h2>
          <p>
            Si vols més informació sobre les classes o sobre el projecte,
            pots escriure el teu missatge en aquest formulari.
          </p>
          <ul class="contact-list">
            <li>Nom.</li>
            <li>Correu electrònic.</li>
            <li>Missatge.</li>
          </ul>
        </div>

        <!-- Formulari: el botó crida enviarCorreu() que obre el client de correu -->
        <form class="panel contact-form">
          <label for="nom">Nom</label>
          <input id="nom" type="text" placeholder="El teu nom" required />

          <label for="correu">Correu electrònic</label>
          <input id="correu" type="email" placeholder="exemple@correu.com" required />

          <label for="missatge">Missatge</label>
          <textarea id="missatge" rows="4" placeholder="Escriu el teu missatge" required></textarea>

          <button class="btn primary" type="button" onclick="enviarCorreu()">Enviar</button>
        </form>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer-inner">
      <p>Muay Khao Reus</p>
      <div class="footer-links">
        <a href="#top">Tornar a l'inici</a>
        <a href="https://www.instagram.com/muaykhaoreus.mt/" target="_blank" rel="noreferrer">Instagram</a>
        <a href="https://facebook.com" target="_blank" rel="noreferrer">Facebook</a>
      </div>
    </div>
  </footer>

  <script src="js/script.js"></script>
  <script>
    function enviarCorreu() {
      let nom = document.getElementById('nom').value;
      let correu = document.getElementById('correu').value;
      let missatge = document.getElementById('missatge').value;
      if (!nom || !correu || !missatge) {
        alert('Si us plau, omple tots els camps.');
        return;
      }
      let body = 'Nom: ' + nom + '\nCorreu: ' + correu +
                 '\nMissatge: ' + missatge;
      window.location.href = 'mailto:paunavarro1315@gmail.com' +
        '?subject=Contacte Muay Khao Reus' +
        '&body=' + encodeURIComponent(body);
    }
  </script>
</body>
</html>
